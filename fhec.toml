# fhec project configuration.
# Every key shown commented-out is at its default value.

[project]
# Directory scanned for .fsol / .sol sources.
src = "contracts"
# Output mirror for transpiled Solidity (committed to git by convention).
out = "generated"
# Include/exclude globs, relative to `src`. Exclusion wins.
# include = ["**/*.fsol", "**/*.sol"]
# exclude = []

[target]
# Target library profile and pinned profile version.
profile = "cofhe"
version = "0.2.x"
# solc requirement used by the verify stage.
# solc = ">=0.8.25 <0.9.0"
# evm_version = "cancun"

[acl]
# "suggest", not the default "insert".
#
# The safety objections are gone: fhec no longer guesses `FHE.allowSender` on a
# slot it cannot prove is keyed by `msg.sender` (fhec #65, #81). Everything
# `insert` writes today is safe.
#
# What still blocks it is bytecode stability. R1 does not know that
# `FHE.allowPublic` subsumes `FHE.allowThis`, so it would append a redundant
# grant in `ERC20ConfidentialLib.syncConfidentialTotalSupply` — and that library
# is pinned and linked by address, so any added instruction forces a redeploy
# and a relink of every host. Tracked as fhec #85.
#
# Revisit when #85 lands: at that point `insert` should reproduce this repo's
# hand-written policy exactly, and the manual grants could be deleted.
mode = "suggest"
