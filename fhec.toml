# fhec project configuration.
# Every key shown commented-out is at its default value.

[project]
# Directory scanned for .fsol / .sol sources.
src = "contracts"
# Output mirror for transpiled Solidity (committed to git by convention).
out = "generated"
# Include/exclude globs, relative to `src`. Exclusion wins.
# include = ["**/*.fsol", "**/*.sol"]
# exclude = []

[target]
# Target library profile and pinned profile version.
profile = "cofhe"
version = "0.2.x"
# solc requirement used by the verify stage.
# solc = ">=0.8.25 <0.9.0"
# evm_version = "cancun"

[acl]
# "insert" — fhec places the ACL grants, the source states the policy.
#
# 24 of the original 35 hand-written grants are now generated, from seven
# `@custom:fhe-allow` policies plus R1. See the policies on the ERC-7201 structs
# in FHERC20Core and ERC20ConfidentialLib, and on the ConfidentialTransfer,
# AmountDiscloseRequested and TokensUnshielded events.
#
# 11 remain. One is inherent; the rest are blocked on open fhec issues:
#   6  fhec #104 — the emit's event is declared in an inherited interface, and a
#      policy there is SILENTLY ignored. Do not delete these: nothing warns, and
#      the suite still passes without them.
#      FHERC20Core (3), FHERC20ERC20WrapperCore (1), FHERC20NativeWrapperCore (1),
#      and the observer grant these would cover.
#   1  fhec #105 — an event policy cannot name a state variable, so the
#      compliance observer grant stays hand-written.
#   4  fhec #106 — no reader form renders `allowGlobal` (MockFHESafeMath).
#   1  inherent — ERC20ConfidentialLib.grantPast loops over caller-supplied
#      handles. A policy describes a declaration, not an imperative backfill.
#      This one will always be hand-written, and that is correct.
mode = "insert"
