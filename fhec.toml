# fhec project configuration.
# Every key shown commented-out is at its default value.

[project]
# Directory scanned for .fsol / .sol sources.
src = "contracts"
# Output mirror for transpiled Solidity (committed to git by convention).
out = "generated"
# Include/exclude globs, relative to `src`. Exclusion wins.
# include = ["**/*.fsol", "**/*.sol"]
# exclude = []

[target]
# Target library profile and pinned profile version.
profile = "cofhe"
version = "0.2.x"
# solc requirement used by the verify stage.
# solc = ">=0.8.25 <0.9.0"
# evm_version = "cancun"

[acl]
# "insert" — fhec places the ACL grants, the source states the policy.
#
# This was "suggest" for most of the port, because R1 could only guess
# `allowThis`/`allowSender` and 22 of the 35 grants here are owner-directed,
# public or global — things spec 8.5 says the transpiler must never guess.
# Reader policies (spec 8.8-8.13, fhec #102) closed that: a policy on the
# storage declaration states who may read, and R4 generates the grant at every
# write. See the `@custom:fhe-allow` lines on the ERC-7201 structs in
# FHERC20Core and ERC20ConfidentialLib.
#
# 13 hand-written grants were deleted this way. The remaining 22 sit on locals,
# parameters and named returns — values that never land in a storage slot a
# policy can attach to — so they stay written by hand and always will.
mode = "insert"
