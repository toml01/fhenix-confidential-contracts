# fhec project configuration.
# Every key shown commented-out is at its default value.

[project]
# Directory scanned for .fsol / .sol sources.
src = "contracts"
# Output mirror for transpiled Solidity (committed to git by convention).
out = "generated"
# Include/exclude globs, relative to `src`. Exclusion wins.
# include = ["**/*.fsol", "**/*.sol"]
# exclude = []

[target]
# Target library profile and pinned profile version.
profile = "cofhe"
version = "0.2.x"
# solc requirement used by the verify stage.
# solc = ">=0.8.25 <0.9.0"
# evm_version = "cancun"

[acl]
# "suggest", not the default "insert".
#
# fhec no longer guesses `FHE.allowSender` on a mapping slot keyed by an address
# other than `msg.sender` (fixed in fhec #65), so the balance leak that first
# forced this setting is gone. One narrower case remains: R1 still adds
# `FHE.allowSender($._totalSupply)` on mint and burn. Total supply is a global
# aggregate that no caller owns, and the hand-written code deliberately grants
# only `FHE.allowThis` there.
#
# This repo has a deliberate, account-directed ACL policy, so it keeps writing
# its own grants. "suggest" reports the same sites as notes and writes nothing.
# See FHEC-FINDINGS.md.
mode = "suggest"
