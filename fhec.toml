# fhec project configuration.
# Every key shown commented-out is at its default value.

[project]
# Directory scanned for .fsol / .sol sources.
src = "contracts"
# Output mirror for transpiled Solidity (committed to git by convention).
out = "generated"
# Include/exclude globs, relative to `src`. Exclusion wins.
# include = ["**/*.fsol", "**/*.sol"]
# exclude = []

[target]
# Target library profile and pinned profile version.
profile = "cofhe"
version = "0.2.x"
# solc requirement used by the verify stage.
# solc = ">=0.8.25 <0.9.0"
# evm_version = "cancun"

[acl]
# "suggest", not the default "insert".
#
# The safety objections are gone (fhec #65, #81) and the redundant-grant one too
# (#86). Everything `insert` writes today is safe, and it now reproduces this
# repo's hand-written policy everywhere except one site.
#
# That site is `ERC20ConfidentialLib.unshieldChecked`, where rule R3 hoists the
# return and adds `FHE.allowTransient(_, msg.sender)`. The library is
# delegatecall-linked and bytecode-pinned, and its only caller already shares the
# value, so the grant is redundant but would force a redeploy and a relink of
# every host. Tracked as fhec #88.
#
# `acl.mode` is global, so one library site keeps the whole repo on "suggest".
# When #88 lands, switch to "insert" and delete the 35 manual FHE.allow* calls.
mode = "suggest"
