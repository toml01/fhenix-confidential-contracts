# fhec project configuration.
# Every key shown commented-out is at its default value.

[project]
# Directory scanned for .fsol / .sol sources.
src = "contracts"
# Output mirror for transpiled Solidity (committed to git by convention).
out = "generated"
# Include/exclude globs, relative to `src`. Exclusion wins.
# include = ["**/*.fsol", "**/*.sol"]
# exclude = []

[target]
# Target library profile and pinned profile version.
profile = "cofhe"
version = "0.2.x"
# solc requirement used by the verify stage.
# solc = ">=0.8.25 <0.9.0"
# evm_version = "cancun"

[acl]
# "suggest", not the default "insert".
#
# This repo has a deliberate, account-directed ACL policy: a balance ciphertext
# is granted to its OWNER (`FHE.allow(ptr, from)`), never to `msg.sender`, who
# in an operator transfer is a third party. Rule R1 appends
# `FHE.allowSender(<slot>)` after every encrypted storage write, which would
# hand that third party read access to another account's balance and to the
# total supply. fhec warns about it (FHE4001) and then inserts it anyway.
#
# "suggest" reports the same sites as FHE4010-FHE4012 notes and writes nothing.
# See FHEC-FINDINGS.md, "default acl.mode = insert injects a confidentiality leak".
mode = "suggest"
