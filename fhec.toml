# fhec project configuration.
# Every key shown commented-out is at its default value.

[project]
# Directory scanned for .fsol / .sol sources.
src = "contracts"
# Output mirror for transpiled Solidity (committed to git by convention).
out = "generated"
# Include/exclude globs, relative to `src`. Exclusion wins.
# include = ["**/*.fsol", "**/*.sol"]
# exclude = []

[target]
# Target library profile and pinned profile version.
profile = "cofhe"
version = "0.2.x"
# solc requirement used by the verify stage.
# solc = ">=0.8.25 <0.9.0"
# evm_version = "cancun"

[acl]
# "suggest", not the default "insert".
#
# Not because `insert` is unsafe any more — it is not. After fhec #65, #81, #86
# and #89, running this repo with `acl.mode = "insert"` adds **nothing** to any
# shipped contract: the generated tree is byte-identical to the one built here,
# `ERC20ConfidentialLib` included. fhec now agrees with this repo's hand-written
# ACL policy at every site. Re-running with `insert` and diffing is a useful way
# to verify that policy still matches what the compiler would do.
#
# The reason to stay on "suggest" is that most of the policy cannot be generated
# at all. Of 35 grants: 12 are `FHE.allow(handle, account)` directed at the
# ACCOUNT OWNER, 6 are `allowPublic`, 4 are `allowGlobal` — and spec 8.5 says
# fhec never auto-emits any of those. Only the 13 `allowThis` calls are in R1's
# reach, and deleting them would have R1 re-insert equivalent grants in a
# different place (after the storage write, keyed by the slot, rather than
# before it on the local). That is behaviour-preserving but not byte-identical,
# and it would move the pinned library's bytecode.
#
# So the grants stay written by hand, and "suggest" reports without touching
# them. This is the end state, not a workaround.
mode = "suggest"
